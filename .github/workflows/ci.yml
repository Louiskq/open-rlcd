name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
      - name: Exp 0 (quick config)
        run: uv run python -m toy.run --quick --out /tmp/rlcd-toy-quick
      - name: README tables are in sync with results/
        run: uv run python scripts/make_readme_tables.py --check
